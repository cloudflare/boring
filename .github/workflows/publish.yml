name: Publish to crates.io

permissions: {}

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: "Version to release, without the v prefix"
        required: true
        type: string

concurrency:
  group: crates-io-publish
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    # Each crate's trusted publisher must name this workflow and environment.
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: "recursive"
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Verify release version
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/master" ]]; then
            echo "Release workflow must be run from the master branch, not ${GITHUB_REF}." >&2
            exit 1
          fi
          metadata="$(cargo metadata --no-deps --format-version 1)"
          for package in boring-sys boring tokio-boring hyper-boring; do
            version="$(jq -r --arg package "${package}" \
              '.packages[] | select(.name == $package) | .version' <<<"${metadata}")"
            if [[ "${version}" != "${EXPECTED_VERSION}" ]]; then
              echo "${package} has version ${version}, expected ${EXPECTED_VERSION}." >&2
              exit 1
            fi
          done
          head_sha="$(git rev-parse HEAD)"
          if ! tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/v${EXPECTED_VERSION}" --jq .sha)"; then
            echo "Could not resolve release tag v${EXPECTED_VERSION}." >&2
            exit 1
          fi
          if [[ "${tag_sha}" != "${head_sha}" ]]; then
            echo "Tag v${EXPECTED_VERSION} points at ${tag_sha}, not the checked-out commit ${head_sha}." >&2
            exit 1
          fi

      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth

      # Dependency order: cargo waits for each version to reach the index.
      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          for package in boring-sys boring tokio-boring hyper-boring; do
            if ! output="$(cargo publish --no-verify -p "${package}" 2>&1)"; then
              # A published version is immutable: cargo's duplicate-upload error means done.
              if ! grep -qE "\`${package}@[^\`]+\` (is already uploaded|already exists on crates.io index)" <<<"${output}"; then
                printf '%s\n' "${output}" >&2
                exit 1
              fi
            fi
          done
